<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#6D28D9',
                        dark: {
                            100: '#1F2937',
                            200: '#111827',
                            300: '#0F172A'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-dark-200 min-h-screen transition-colors duration-300">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 dark:text-white" data-lang="app.title">Music Player</h1>
            <div class="flex items-center space-x-4">
                <label class="relative cursor-pointer bg-primary hover:bg-secondary text-white px-4 py-2 rounded-lg transition-colors">
                    <input type="file" id="musicFileInput" accept="audio/*" class="hidden" multiple>
                    <i class="fas fa-upload mr-2"></i>
                    <span data-lang="app.import">Import Music</span>
                </label>
                <select id="languageSelect" class="bg-white dark:bg-dark-100 text-gray-800 dark:text-white rounded-lg px-3 py-2">
                    <option value="en">English</option>
                    <option value="fa">فارسی</option>
                    <option value="ps">پښتو</option>
                </select>
                <button id="darkModeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-dark-100">
                    <i class="fas fa-moon dark:text-white"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="relative mb-8">
            <input type="text" 
                   class="w-full px-4 py-3 rounded-lg bg-white dark:bg-dark-100 text-gray-800 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-primary focus:outline-none"
                   placeholder="Search for songs..." 
                   data-lang="app.search">
            <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        </div>

        <!-- Now Playing -->
        <div class="bg-white dark:bg-dark-100 rounded-2xl shadow-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-white" data-lang="app.now_playing">Now Playing</h2>
            <div class="flex items-center space-x-4">
                <div class="w-24 h-24 rounded-lg bg-gray-200 dark:bg-dark-300 overflow-hidden">
                    <img src="assets/images/album-placeholder.jpg" alt="Album Art" class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <h3 id="currentSongTitle" class="text-lg font-semibold text-gray-800 dark:text-white">No song selected</h3>
                    <p id="currentArtist" class="text-gray-600 dark:text-gray-400">Import a song to start playing</p>
                    <!-- Audio Element -->
                    <audio id="audioPlayer"></audio>
                    <!-- Progress Bar -->
                    <div class="mt-4">
                        <div class="h-1 bg-gray-200 dark:bg-dark-300 rounded-full progress">
                            <div class="h-1 bg-primary rounded-full progress-current" style="width: 0%"></div>
                        </div>
                        <div class="flex justify-between text-sm text-gray-600 dark:text-gray-400 mt-1">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Controls -->
            <div class="flex justify-center items-center space-x-6 mt-6">
                <button class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary">
                    <i class="fas fa-random text-xl"></i>
                </button>
                <button class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary">
                    <i class="fas fa-step-backward text-xl"></i>
                </button>
                <button class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center hover:bg-secondary transition-colors">
                    <i class="fas fa-play text-xl"></i>
                </button>
                <button class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary">
                    <i class="fas fa-step-forward text-xl"></i>
                </button>
                <button class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary">
                    <i class="fas fa-redo text-xl"></i>
                </button>
            </div>
        </div>


        <!-- Playlist -->
        <div class="bg-white dark:bg-dark-100 rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-white" data-lang="app.playlist">Playlist</h2>
            <div class="space-y-4">
                <!-- Playlist Item -->
                <div class="flex items-center p-3 hover:bg-gray-50 dark:hover:bg-dark-300 rounded-lg transition-colors cursor-pointer">
                    <div class="w-12 h-12 rounded bg-gray-200 dark:bg-dark-300 mr-4">
                        <img src="assets/images/album-placeholder.jpg" alt="Album Art" class="w-full h-full object-cover rounded">
                    </div>
                    <div class="flex-1">
                        <h4 class="text-gray-800 dark:text-white font-medium">Another Song Title</h4>
                        <p class="text-gray-600 dark:text-gray-400 text-sm">Another Artist</p>
                    </div>
                    <span class="text-gray-600 dark:text-gray-400">3:45</span>
                </div>
                <!-- More playlist items would go here -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
